{% extends "financas/base.html" %}

{% block titulo %}{{ titulo }} - Controle de Gastos{% endblock %}

{% block conteudo %}
  <h1>{{ titulo }}</h1>

  <form method="post" class="formulario" novalidate>
    {% csrf_token %}

    {% for campo in form %}
      <div class="campo">
        <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% for erro in campo.errors %}
          <p class="erro">{{ erro }}</p>
        {% endfor %}
      </div>
    {% endfor %}

    <div class="acoes">
      <button type="submit" class="botao">Salvar</button>
      <a class="botao botao-secundario" href="{{ url_cancelar }}">Cancelar</a>
    </div>
  </form>
{% endblock %}
